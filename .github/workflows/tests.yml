name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-api.txt 'httpx>=0.27,<1'
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
